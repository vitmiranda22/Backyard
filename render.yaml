services:
  - type: web
    name: backyard-marketing
    runtime: static
    buildCommand: echo "plain static HTML, no build step"
    staticPublishPath: ./marketing/site

  - type: web
    name: backyard-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: GOOGLE_STREETVIEW_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GEONAMES_USERNAME
        sync: false
      - key: EUROPEANA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Matches app/config.py's own defaults (free = one 5-block tour/day,
      # premium = three 12-block tours/day) -- set explicitly here (rather
      # than removed) so this deploy actually overwrites whatever's live on
      # Render right now, instead of leaving a stale, much looser value
      # (80/100, from loosening these for TestFlight testing) in place.
      - key: DAILY_NARRATION_LIMIT_FREE
        value: "5"
      - key: DAILY_NARRATION_LIMIT_PREMIUM
        value: "36"
      - key: MINUTE_NARRATION_LIMIT
        value: "15"
      - key: DAILY_QUESTION_LIMIT_FREE
        value: "8"
      - key: DAILY_QUESTION_LIMIT_PREMIUM
        value: "25"
      - key: ENVIRONMENT
        value: production
